<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="application-name" content="AI-DSUHIS">
  <meta name="description" content="AI-DSUHIS healthcare information system.">
  <meta name="theme-color" content="#071A33">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AI-DSUHIS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AI-DSUHIS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      /* Flutter routes own their overflow.  The landing route is constrained
         to one viewport; long dashboards/auth forms can still scroll. */
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-x: none;
      -webkit-text-size-adjust: 100%;
      background: #071A33;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #app-startup-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #071A33;
      color: #F8FBFF;
      text-align: center;
      transition: opacity 160ms ease;
    }

    #app-startup-loader[hidden] {
      display: none;
    }

    #app-startup-loader .startup-content {
      display: grid;
      justify-items: center;
      gap: 14px;
      padding: 24px;
    }

    #app-startup-loader img {
      width: 76px;
      height: 76px;
      object-fit: contain;
    }

    #app-startup-loader .startup-progress {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(248, 251, 255, 0.28);
      border-top-color: #2F80ED;
      border-radius: 50%;
      animation: startup-spin 800ms linear infinite;
    }

    #app-startup-loader p {
      margin: 0;
      color: #D4E3F2;
      font-size: 14px;
      font-weight: 600;
    }

    #web-connectivity-status {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 10001;
      box-sizing: border-box;
      padding: 9px 20px;
      color: #FFFFFF;
      background: #B45309;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      box-shadow: 0 4px 14px rgba(7, 26, 51, 0.18);
    }

    #web-connectivity-status[data-state="online"] {
      background: #18794E;
    }

    @keyframes startup-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  
</head>
<body>
  <div id="web-connectivity-status" role="status" aria-live="polite" hidden></div>
  <div id="app-startup-loader" role="status" aria-live="polite">
    <div class="startup-content">
      <img
        src="/assets/assets/newlogo_white.png"
        width="76"
        height="76"
        alt="AI-DSUHIS"
      >
      <div class="startup-progress" aria-hidden="true"></div>
      <p>Preparing your AI-DSUHIS workspace…</p>
    </div>
  </div>

  <script>
    // Browser connectivity owns this route-independent notice. Keeping it
    // outside Flutter means it survives navigator/shell rebuilds and can
    // report an interrupted connection even while the canvas is busy.
    (() => {
      const banner = document.getElementById('web-connectivity-status');
      if (!banner) return;

      let wasOffline = false;
      let restoredTimer;
      const showOffline = () => {
        clearTimeout(restoredTimer);
        wasOffline = true;
        banner.dataset.state = 'offline';
        banner.textContent = 'You are offline. Showing saved data; new changes will sync when the connection returns.';
        banner.hidden = false;
      };
      const showOnline = () => {
        if (!wasOffline) return;
        clearTimeout(restoredTimer);
        wasOffline = false;
        banner.dataset.state = 'online';
        banner.textContent = 'Connection restored. Syncing the latest records.';
        banner.hidden = false;
        restoredTimer = setTimeout(() => {
          banner.hidden = true;
        }, 4000);
      };

      window.addEventListener('offline', showOffline);
      window.addEventListener('online', showOnline);
      if (!navigator.onLine) showOffline();
    })();

  </script>

  <!-- FlutterFire loads the compatible modular Firebase SDK. -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove the static fallback only after Flutter has created its view. This
    // prevents a slow or failed bootstrap from appearing as a blank white page
    // while leaving the Flutter startup/error UI in control once available.
    (() => {
      const loader = document.getElementById('app-startup-loader');
      if (!loader) return;

      const revealFlutter = () => {
        if (!document.querySelector('flutter-view')) return false;
        loader.hidden = true;
        return true;
      };

      if (revealFlutter()) return;
      const observer = new MutationObserver(() => {
        if (revealFlutter()) observer.disconnect();
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
